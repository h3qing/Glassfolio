[project]
name = "glassfolio"
version = "0.1.0"
description = "See through your portfolio: local-first look-through exposure across accounts."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Heqing Huang" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "keyring>=25.7.0",
    "python-multipart>=0.0.32",
    "starlette>=1.7.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
glassfolio = "glassfolio.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
