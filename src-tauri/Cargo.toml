[package]
name = "glassfolio"
version = "0.1.0"
description = "See through your portfolio"
authors = ["Heqing Huang"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "glassfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-liquid-glass = "0.1"
tauri-plugin-dialog = "2"
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
